on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6.0.0
      with:
        global-json-file: global.json
    - name: Test
      run: dotnet test ./src/ParkingLot.Tests/ParkingLot.Tests.csproj
